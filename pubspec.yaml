name: clinical_warehouse
description: "A new Flutter project."
publish_to: 'none'

version: 2.3.1+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  fl_chart: ^0.70.2
  get_it: ^9.2.0
  go_router: ^17.0.1
  google_fonts: ^8.0.2
  flutter_secure_storage: ^10.0.0
  window_manager: ^0.5.1
  uuid: ^4.5.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  glass_kit: ^4.0.2
  dio: ^5.7.0
  sqflite_sqlcipher: ^3.4.0
  path: ^1.9.1
  sqflite_common_ffi: ^2.3.7+1
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  pluto_grid: ^8.1.0
  file_picker: ^10.3.8
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  spreadsheet_decoder: ^2.1.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  http: ^1.6.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.6
  image: ^4.3.0
  zxing_lib: ^1.1.4
  pdfx: ^2.6.0
  sqlite3_flutter_libs: ^0.6.0+eol
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.10.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google_logo.png

msix_config:
  display_name: Clinical Warehouse
  publisher_display_name: OBI
  identity_name: com.obi.clinicalwarehouse
  msix_version: 2.3.1.0
  logo_path: assets/logo.png
  capabilities: internetClient, internetClientServer, privateNetworkClientServer
  architecture: x64
  install: false
  publisher: CN=OBI, O=OBI, L=Tashkent, S=Tashkent, C=UZ
  install_certificate: true
